name: E2E Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard?schema=public
      REDIS_URL: redis://localhost:6379
      BACKEND_PORT: 4000
      API_URL: http://localhost:4000
      JWT_SECRET: ci-test-secret-key
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_EMAIL: admin@a-school.kz
      ADMIN_PASSWORD: changeme123
      ADMIN_NAME: CI Admin
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Apply DB migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: npx ts-node prisma/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: apps/backend
        run: npx ts-node -r tsconfig-paths/register src/main.ts > backend.log 2>&1 &

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Start frontend
        working-directory: apps/frontend
        run: npm run start > frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4000/api/auth/login -o /dev/null && break
            sleep 1
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3100 -o /dev/null && break
            sleep 1
          done

      - name: Run Playwright tests
        run: npx playwright test -c apps/e2e/playwright.config.js

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14